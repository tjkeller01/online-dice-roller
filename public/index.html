<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shared Multi-Pool Dice Roller Pro</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎲</text></svg>">
    <script src="/socket.io/socket.io.js"></script>
    <style>
        :root {
            --bg-color: #121214;
            --card-bg: #1e1e24;
            --accent-color: #ff4757;
            --accent-hover: #ff6b81;
            --text-color: #f1f2f6;
            --muted-text: #a4b0be;
            --border-color: #2f3542;
            --success-color: #2ed573;
            --warning-color: #ffa502;
            --crit-success: #00ff88;
            --crit-fail: #ff3838;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 1200px;
            display: grid;
            grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr);
            gap: 20px;
        }

        @media (max-width: 900px) {
            .container { grid-template-columns: 1fr; }
        }

        h2 { margin-top: 0; color: var(--text-color); border-bottom: 2px solid var(--border-color); padding-bottom: 8px; font-size: 1.3rem;}

        .card {
            background-color: var(--card-bg);
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.4);
            border: 1px solid var(--border-color);
        }

        .form-group { margin-bottom: 16px; }
        label { display: block; margin-bottom: 6px; font-weight: 600; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.5px; color: var(--muted-text); }
        
        input, select {
            width: 100%; padding: 10px; border: 1px solid var(--border-color); border-radius: 6px;
            background-color: #121214; color: #fff; box-sizing: border-box; font-size: 1rem;
        }
        input:focus, select:focus { border-color: var(--accent-color); outline: none; }

        .username-card {
            background: rgba(255, 71, 87, 0.1);
            border: 1px solid var(--accent-color);
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 15px;
        }

        .features-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            background: #121214;
            padding: 14px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            margin-bottom: 16px;
        }

        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            font-size: 0.85rem;
            text-transform: none;
            letter-spacing: normal;
            color: var(--text-color);
            font-weight: 500;
        }
        .checkbox-label input { width: auto; margin: 0; }

        .dice-builder-list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 15px; }
        .dice-pool-row {
            display: flex; gap: 10px; align-items: center; background: #121214;
            padding: 10px; border-radius: 6px; border: 1px solid var(--border-color);
        }
        .dice-pool-row input[type="number"] { width: 70px; text-align: center; }
        .dice-pool-row select { flex: 2; }
        .dice-pool-row .custom-sides-input { flex: 1; display: none; }

        .btn-icon {
            background: #ff4757; color: white; border: none; padding: 10px; 
            border-radius: 6px; cursor: pointer; font-weight: bold; width: 40px;
        }
        .btn-icon:hover { background: var(--accent-hover); }

        .adv-toggle-group { display: flex; gap: 8px; margin-bottom: 20px; }
        .adv-btn {
            flex: 1; background: #2f3542; color: var(--muted-text); border: none; padding: 10px;
            border-radius: 6px; font-weight: bold; cursor: pointer; transition: all 0.2s; text-align: center;
        }
        .adv-btn.active[data-mode="normal"] { background: #747d8c; color: white; }
        .adv-btn.active[data-mode="advantage"] { background: var(--success-color); color: white; }
        .adv-btn.active[data-mode="disadvantage"] { background: var(--warning-color); color: white; }

        button.primary-roll {
            width: 100%; padding: 14px; background-color: var(--accent-color); color: white;
            border: none; border-radius: 6px; font-size: 1.2rem; font-weight: bold; cursor: pointer; transition: background 0.2s;
        }
        button.primary-roll:hover { background-color: var(--accent-hover); }
        button.secondary { background-color: #2f3542; margin-top: 10px; font-size: 0.85rem; padding: 8px; color: #fff; border: none; border-radius: 4px; cursor: pointer; }
        button.secondary:hover { background-color: #3f4656; }

        .result-display {
            text-align: center; padding: 20px; background: #121214; border-radius: 8px;
            margin-bottom: 20px; border-left: 5px solid var(--accent-color);
            transition: all 0.3s;
        }
        .result-display.crit-hit-glow { border-left-color: var(--crit-success); box-shadow: inset 0 0 15px rgba(0, 255, 136, 0.15); }
        .result-display.crit-miss-glow { border-left-color: var(--crit-fail); box-shadow: inset 0 0 15px rgba(255, 56, 56, 0.15); }
        .result-display.crit-both-glow { border-left-color: #a55eea; box-shadow: inset 0 0 15px rgba(165, 94, 234, 0.15); }

        .total-score { font-size: 3.5rem; font-weight: 800; color: #fff; margin: 8px 0; }
        .breakdown { font-size: 0.95rem; color: var(--muted-text); text-align: left; line-height: 1.5; }
        .pool-breakdown-line { border-bottom: 1px dashed #2f3542; padding: 4px 0; }
        .dropped { text-decoration: line-through; color: #57606f; opacity: 0.5; }
        
        .die-val { padding: 1px 4px; border-radius: 3px; font-weight: bold; margin: 0 1px; background: #2f3542; color: #fff; }
        .die-val.crit-success-text { background: rgba(0, 255, 136, 0.2); color: var(--crit-success); border: 1px solid var(--crit-success); }
        .die-val.crit-fail-text { background: rgba(255, 56, 56, 0.2); color: var(--crit-fail); border: 1px solid var(--crit-fail); }

        .list-container { max-height: 500px; overflow-y: auto; margin-bottom: 15px; padding-right: 4px;}
        .history-item {
            padding: 12px; border-bottom: 1px solid var(--border-color); font-size: 0.9rem;
            display: flex; justify-content: space-between; align-items: center; gap: 10px;
        }
        .history-item:first-child { background-color: rgba(255, 71, 87, 0.05); border-radius: 4px; border-left: 4px solid var(--accent-color); }
        
        .history-item.crit-success-card { border-left: 5px solid var(--crit-success) !important; background-color: rgba(0, 255, 136, 0.03); }
        .history-item.crit-fail-card { border-left: 5px solid var(--crit-fail) !important; background-color: rgba(255, 56, 56, 0.03); }
        .history-item.crit-both-card { border-left: 5px solid #a55eea !important; background-color: rgba(165, 94, 234, 0.03); }

        .history-meta { font-size: 0.75rem; color: var(--muted-text); margin-top: 4px; }
        .player-tag { color: var(--accent-color); font-weight: bold; font-size: 0.95rem; }

        .badge { padding: 2px 6px; border-radius: 4px; font-size: 0.75rem; font-weight: bold; margin-left: 4px; display: inline-block;}
        .badge.adv { background: var(--success-color); color: #fff; }
        .badge.dis { background: var(--warning-color); color: #fff; }
        .badge.crit-hit { background: var(--crit-success); color: #121214; }
        .badge.crit-miss { background: var(--crit-fail); color: #fff; }
        .badge.exploding { background: #6c5ce7; color: #fff; }

        .preset-tags { display: flex; flex-direction: column; gap: 6px; }
        .preset-row {
            display: flex; justify-content: space-between; align-items: center;
            background: #2f3542; padding: 8px 12px; border-radius: 6px; font-size: 0.9rem;
        }
        .preset-info { cursor: pointer; flex-grow: 1; }
        .preset-delete { background: none; border: none; color: #ff4757; cursor: pointer; font-weight: bold; }
        /* Let grid/flex content wrap instead of expanding or clipping the cards. */
        .container, .card, .preset-info { min-width: 0; }
        .card { overflow-wrap: anywhere; }
        .container { box-sizing: border-box; }
        .features-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        .checkbox-label input, .btn-icon, .preset-delete { flex-shrink: 0; }
        .dice-pool-row { flex-wrap: wrap; }
        .dice-pool-row .pool-count { flex: 0 0 70px; }
        .dice-pool-row select { flex: 2 1 110px; min-width: 110px; width: auto; }
        .dice-pool-row .custom-sides-input { flex: 1 1 90px; min-width: 80px; }
        .adv-toggle-group { flex-wrap: wrap; }
        .adv-btn { flex: 1 1 100px; }
        .history-item > div:first-child {
            flex: 1; min-width: 0;
            /* Override the generated legacy clipping rule; preserve all details. */
            overflow: visible !important;
        }
        .history-item { align-items: flex-start; }
        .history-item > div:last-child { flex-shrink: 0; }
        .preset-row { gap: 10px; }
        @media (max-width: 900px) {
            .container { grid-template-columns: minmax(0, 1fr); }
            .total-score { font-size: 2.5rem; }
        }
    </style>
</head>
<body>

<div class="container">
    
    <main class="card">
        <div class="username-card">
            <label for="username" style="color: #fff;">Your Character/Player Name</label>
            <input type="text" id="username" placeholder="Enter name...">
        </div>

        <h2>Assemble Dice Roll</h2>
        <div class="form-group">
            <div id="diceBuilderList" class="dice-builder-list"></div>
            <button type="button" id="addPoolBtn" class="secondary">+ Add Another Dice Type</button>
        </div>

        <div class="form-group">
            <label for="modifier">Flat Modifier</label>
            <input type="number" id="modifier" value="0">
        </div>

        <div class="form-group">
            <label>Rule Enhancements</label>
            <div class="features-grid">
                <div>
                    <label class="checkbox-label">
                        <input type="checkbox" id="enableExploding"> Exploding Dice (Max rolls re-roll)
                    </label>
                </div>
                <div>
                    <label class="checkbox-label">
                        <input type="checkbox" id="enableAlerts" checked> Monitor d20 Crits (1s & 20s)
                    </label>
                </div>
            </div>
        </div>

        <div class="form-group">
            <label>Roll Mode</label>
            <div class="adv-toggle-group">
                <button class="adv-btn active" data-mode="normal">Normal</button>
                <button class="adv-btn" data-mode="advantage">Advantage</button>
                <button class="adv-btn" data-mode="disadvantage">Disadvantage</button>
            </div>
        </div>

        <div class="form-group">
            <label for="presetName">Save Configuration Locally</label>
            <input type="text" id="presetName" placeholder="e.g., Paladin Divine Smite">
        </div>

        <button id="rollBtn" class="primary-roll">ROLL ALL DICE</button>
        <div id="rollStatus" role="status" aria-live="polite"></div>
        <button id="savePresetBtn" class="secondary" style="width: 100%;">Save Setup to My Device</button>

        <div style="margin-top: 24px;">
            <label>Your Saved Custom Setups:</label>
            <div id="presetContainer" class="preset-tags"></div>
        </div>
    </main>

    <section class="card">
        <h2>Latest Live Result</h2>
        <div id="displayContainer" class="result-display">
            <div id="resultLabel" style="font-size: 0.85rem; color: var(--muted-text); font-weight: bold; text-transform: uppercase; margin-bottom: 5px;">Waiting for a roll...</div>
            <div id="totalScore" class="total-score">--</div>
            <div id="breakdown" class="breakdown"></div>
        </div>

        <h2>Shared Room History</h2>
        <div class="list-container">
            <div id="historyList"></div>
        </div>
        <button id="clearHistoryBtn" class="secondary" style="float: right;" disabled title="Disabled until host controls are available">Clear Room Log (disabled)</button>
    </section>

</div>

<script src="/dice.js"></script>
<script src="/app.js"></script>
</body>
</html>
